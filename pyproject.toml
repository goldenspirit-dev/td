[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tda-fruit-ct"
version = "0.1.0"
description = "Topological Data Analysis of fruit CT scans via persistent homology."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
